#cloud-config
# Reusable cloud-init fragment: installs/enables qemu-guest-agent (required
# for every "guest-level" metric: memory_available/usable_bytes consumers,
# filesystem_capacity/used_bytes, guest_load_1m/5m/15m and the
# vmi:kubevirt_vmi_guest_queue_length:sum recording rule that backs
# GuestVCPUQueueHighWarning/Critical), plus stress-ng and two small helper
# scripts used to deliberately trip the memory and vCPU-queue alerts for the
# demo. qemu-guest-agent version matters: guest_load_1m/5m/15m specifically
# needs qemu-guest-agent >= 10.0.0 -- check `qemu-ga --version` in the guest
# if that panel stays blank even with AgentConnected=True.
#
# RHEL 9 cloud images ship qemu-guest-agent already; this fragment still
# installs it explicitly so the same cloud-init works on a minimal/other
# guest image.
package_update: true
packages:
  - qemu-guest-agent
  - stress-ng
runcmd:
  - systemctl enable --now qemu-guest-agent
  - |
    cat > /usr/local/bin/trigger-vcpu-queue.sh <<'SCRIPT'
    #!/bin/bash
    # GuestVCPUQueueHighWarning fires when vmi:kubevirt_vmi_guest_queue_length:sum
    # (= clamp_min(kubevirt_vmi_guest_load_1m - vcpu_count, 0)) > 10; Critical > 20.
    # No "for" duration on either -- it fires on the first evaluation after the
    # 1-minute guest load average crosses the line. Spawn far more CPU-bound
    # stressors than this VM has vCPUs and hold for a few minutes so the 1m
    # load average has time to climb.
    NPROC=$(nproc)
    TARGET=${1:-$((NPROC + 15))}   # NPROC+11 crosses Warning, NPROC+21 crosses Critical
    echo "vCPUs=$NPROC, spawning $TARGET cpu-bound stressors for 6m"
    stress-ng --cpu "$TARGET" --cpu-load 100 --timeout 360s
    SCRIPT
    chmod +x /usr/local/bin/trigger-vcpu-queue.sh
  - |
    cat > /usr/local/bin/trigger-mem-pressure.sh <<'SCRIPT'
    #!/bin/bash
    # KubeVirtVMGuestMemoryAvailableLow: headroom_ratio (usable/available) < 0.03
    # for 30m, with LOW swap + LOW major-fault rate (severity=info: "tight but
    # not thrashing"). KubeVirtVMGuestMemoryPressure: headroom_ratio < 0.05 for
    # 5m WITH elevated major faults or >1MiB/5m swap I/O (severity=warning:
    # "thrashing"). Pick the mode you want to demo; they are different guest
    # behaviors, not just a bigger number.
    MODE=${1:-pressure}   # "low" or "pressure"
    MEMTOTAL_KB=$(awk '/MemTotal/{print $2}' /proc/meminfo)
    if [[ "$MODE" == "low" ]]; then
      # Fill to ~98% without swapping: steady allocation, touch pages once, hold.
      BYTES=$(( MEMTOTAL_KB * 98 / 100 * 1024 ))
      echo "MODE=low: allocating ~98% of guest RAM once, holding steady (aim: no swap, no major faults)"
      stress-ng --vm 1 --vm-bytes "${BYTES}" --vm-method zero-one --vm-keep --timeout 35m
    else
      # Force real thrashing: allocate beyond available RAM so the guest swaps
      # and takes major faults. Requires swap configured in the guest.
      BYTES=$(( MEMTOTAL_KB * 130 / 100 * 1024 ))
      echo "MODE=pressure: allocating ~130% of guest RAM to force swap + major faults"
      stress-ng --vm 2 --vm-bytes "${BYTES}" --vm-method all --timeout 10m
    fi
    SCRIPT
    chmod +x /usr/local/bin/trigger-mem-pressure.sh

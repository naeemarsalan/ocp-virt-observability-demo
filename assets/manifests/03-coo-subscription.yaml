# Step 4 -- Cluster Observability Operator, stable channel, 1.5+ (Perses GA).
apiVersion: v1
kind: Namespace
metadata:
  name: openshift-cluster-observability-operator
---
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: cluster-observability-operator-group
  namespace: openshift-cluster-observability-operator
spec: {}
---
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: cluster-observability-operator
  namespace: openshift-cluster-observability-operator
spec:
  channel: stable
  name: cluster-observability-operator
  source: redhat-operators
  sourceNamespace: openshift-marketplace
  installPlanApproval: Automatic
  # COO does not use per-OCP-minor channels the way Logging does; "stable"
  # tracks the latest 1.x. Preflight check #3 confirms you actually landed on
  # >= 1.5 before you rely on Perses/Monitoring UIPlugin GA behavior.

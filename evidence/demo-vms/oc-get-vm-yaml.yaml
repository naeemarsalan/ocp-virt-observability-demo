              #cloud-config
              package_update: true
              packages:
                - qemu-guest-agent
                - stress-ng
              password: fedora
              chpasswd:
                expire: false
              ssh_pwauth: true
              runcmd:
                - systemctl enable --now qemu-guest-agent
                - |
                  cat > /usr/local/bin/trigger-vcpu-queue.sh <<'SCRIPT'

# New ServiceAccount + ClusterRoleBindings for the demo ClusterLogForwarder
# 'demo-loki'. Does NOT touch the existing 'collector' SA used by CLF 'instance'.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: demo-collector
  namespace: openshift-logging
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: demo-collector-collect-application-logs
subjects:
  - kind: ServiceAccount
    name: demo-collector
    namespace: openshift-logging
roleRef:
  kind: ClusterRole
  name: collect-application-logs
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: demo-collector-collect-infrastructure-logs
subjects:
  - kind: ServiceAccount
    name: demo-collector
    namespace: openshift-logging
roleRef:
  kind: ClusterRole
  name: collect-infrastructure-logs
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: demo-collector-logging-collector-logs-writer
subjects:
  - kind: ServiceAccount
    name: demo-collector
    namespace: openshift-logging
roleRef:
  kind: ClusterRole
  name: logging-collector-logs-writer
  apiGroup: rbac.authorization.k8s.io
---
# Read-path bindings so demo-collector's token can also be used to query the
# LokiStack gateway (proof-of-flow verification step). These ClusterRoles are
# auto-created by the 'logging' UIPlugin, not by us.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: demo-collector-cluster-logging-application-view
subjects:
  - kind: ServiceAccount
    name: demo-collector
    namespace: openshift-logging
roleRef:
  kind: ClusterRole
  name: cluster-logging-application-view
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: demo-collector-cluster-logging-infrastructure-view
subjects:
  - kind: ServiceAccount
    name: demo-collector
    namespace: openshift-logging
roleRef:
  kind: ClusterRole
  name: cluster-logging-infrastructure-view
  apiGroup: rbac.authorization.k8s.io

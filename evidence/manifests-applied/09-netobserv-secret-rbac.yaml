# Grants the netobserv operator's controller-manager SA (in
# openshift-netobserv-operator) permission to read/create Secrets in the
# netobserv namespace -- required for LokiStack gateway integration
# (reading loki-*-http secrets, creating netobserv-plugin client secrets).
# Uses the ClusterRoles netobserv-secret-watcher / netobserv-secret-creator
# that ship with the netobserv-operator CSV; this only binds them, scoped to
# the netobserv namespace, per the operator's own documented remediation.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: secret-watcher
  namespace: netobserv
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: netobserv-secret-watcher
subjects:
  - kind: ServiceAccount
    name: netobserv-controller-manager
    namespace: openshift-netobserv-operator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: secret-creator
  namespace: netobserv
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: netobserv-secret-creator
subjects:
  - kind: ServiceAccount
    name: netobserv-controller-manager
    namespace: openshift-netobserv-operator

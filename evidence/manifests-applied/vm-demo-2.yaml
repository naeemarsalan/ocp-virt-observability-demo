apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: vm-demo-2
  namespace: demo-vms
  labels:
    app: demo
    tier: db
spec:
  runStrategy: Always
  dataVolumeTemplates:
    - metadata:
        name: vm-demo-2-rootdisk
      spec:
        storage:
          accessModes:
            - ReadWriteMany
          volumeMode: Filesystem
          resources:
            requests:
              storage: 30Gi
          storageClassName: nfs-csi
        sourceRef:
          kind: DataSource
          name: fedora
          namespace: openshift-virtualization-os-images
  template:
    metadata:
      labels:
        app: demo
        tier: db
    spec:
      evictionStrategy: LiveMigrate
      domain:
        cpu:
          cores: 2
        resources:
          requests:
            memory: 4Gi
        devices:
          disks:
            - name: rootdisk
              disk:
                bus: virtio
            - name: cloudinitdisk
              disk:
                bus: virtio
          interfaces:
            - name: default
              masquerade: {}
      networks:
        - name: default
          pod: {}
      volumes:
        - name: rootdisk
          dataVolume:
            name: vm-demo-2-rootdisk
        - name: cloudinitdisk
          cloudInitNoCloud:
            userData: |
              #cloud-config
              package_update: true
              packages:
                - qemu-guest-agent
                - stress-ng
              password: fedora
              chpasswd:
                expire: false
              ssh_pwauth: true
              runcmd:
                - systemctl enable --now qemu-guest-agent
                - |
                  cat > /usr/local/bin/trigger-vcpu-queue.sh <<'SCRIPT'
                  #!/bin/bash
                  NPROC=$(nproc)
                  TARGET=${1:-$((NPROC + 15))}
                  echo "vCPUs=$NPROC, spawning $TARGET cpu-bound stressors for 6m"
                  stress-ng --cpu "$TARGET" --cpu-load 100 --timeout 360s
                  SCRIPT
                  chmod +x /usr/local/bin/trigger-vcpu-queue.sh
                - |
                  cat > /usr/local/bin/trigger-mem-pressure.sh <<'SCRIPT'
                  #!/bin/bash
                  MODE=${1:-pressure}
                  MEMTOTAL_KB=$(awk '/MemTotal/{print $2}' /proc/meminfo)
                  if [[ "$MODE" == "low" ]]; then
                    BYTES=$(( MEMTOTAL_KB * 98 / 100 * 1024 ))
                    stress-ng --vm 1 --vm-bytes "${BYTES}" --vm-method zero-one --vm-keep --timeout 35m
                  else
                    BYTES=$(( MEMTOTAL_KB * 130 / 100 * 1024 ))
                    stress-ng --vm 2 --vm-bytes "${BYTES}" --vm-method all --timeout 10m
                  fi
                  SCRIPT
                  chmod +x /usr/local/bin/trigger-mem-pressure.sh
